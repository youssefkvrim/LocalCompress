stages:
  - build

variables:
  IMAGE_REPO: "$HARBOR_URL/$HARBOR_PROJECT/$CI_PROJECT_NAME"
  IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"

build:image:
  stage: build
  tags:
    - aws-buildah
  script:
    - buildah login -u "$HARBOR_USER" -p "$HARBOR_PASSWORD" "$HARBOR_URL"
    - buildah bud --pull --layers -f Dockerfile -t "$IMAGE_REPO:$IMAGE_TAG" -t "$IMAGE_REPO:latest" .
    - buildah push "$IMAGE_REPO:$IMAGE_TAG"
    - buildah push "$IMAGE_REPO:latest"
  rules:
    # Only what ends up in the image: a commit touching only the ROSA manifest or the docs
    # builds nothing (otherwise every manifest update would produce a new, unused tag).
    - if: '$CI_COMMIT_BRANCH'
      changes:
        - .gitlab-ci.yml
        - Dockerfile
        - .npmrc
        - package.json
        - package-lock.json
        - index.html
        - tsconfig.json
        - vite.config.ts
        - src/**/*
        - public/**/*
        - models/**/*
        - scripts/**/*
        - deploy/localkit.nginx.conf
        - deploy/certs/**/*
    - if: '$CI_PIPELINE_SOURCE == "web"'
